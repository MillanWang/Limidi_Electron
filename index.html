<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <title>LiMIDI</title>
    <script src="dist/renderer.js" defer></script>
  </head>

  <body>
    <div class="bg-blobs" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>
    <div class="main">
      <h1 class="text">LiMIDI</h1>
      <p class="text">
        <span id="connection-code"></span>
      </p>
      <img id="qr" alt="Pairing QR code" hidden />
      <span class="text" id="qr-error"></span>

      <div class="connection-indicator">
        <span class="status-dot disconnected" id="status-dot"></span>
        <span id="connection-status">Waiting for connection...</span>
      </div>

      <button id="restart-button" class="restart-button">Restart</button>
    </div>
    <span id="version" class="version-label"></span>
  </body>
</html>
